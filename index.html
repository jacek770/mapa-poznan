document.getElementById('searchBox').addEventListener('input', function() {

  const szukane = this.value.toLowerCase().trim();

  punkty.forEach(function(punkt) {

    if (
      szukane === '' ||
      punkt.kategoria.includes(szukane) ||
      punkt.nazwa.includes(szukane)
    ) {
      if (!map.hasLayer(punkt.marker)) {
        punkt.marker.addTo(map);
      }
    } else {
      if (map.hasLayer(punkt.marker)) {
        map.removeLayer(punkt.marker);
      }
    }

  });

});
</script>
