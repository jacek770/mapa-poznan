<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .custom-marker {
      background: red;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid white;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([52.4064, 16.9252], 13);

  L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  const redIcon = L.divIcon({
    className: 'custom-marker',
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  });

  L.marker([52.408, 16.934], {
    icon: redIcon
  })
  .addTo(map)
  .bindPopup('<b>Mural 1</b><br>Stary Rynek');

  L.marker([52.408404, 16.957374], {
  icon: L.divIcon({
    className: 'custom-marker',
    html: '<div style="background:orange; width:20px; height:20px; border-radius:50%; border:3px solid white;"></div>',
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  })
})
  .addTo(map)
  .bindPopup('<b>Mural 2</b><br>Poznań');

  L.marker([52.391, 16.953], {
    icon: redIcon
  })
  .addTo(map)
  .bindPopup('<b>Mural 3</b><br>Posnania');
</script>

</body>
</html>
