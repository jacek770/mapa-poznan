<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

  const map = L.map('map').setView([52.4064, 16.9252], 13);

  L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  L.marker([52.408, 16.934])
    .addTo(map)
    .bindPopup('<b>Mural 1</b><br>Stary Rynek');

  L.marker([52.402, 16.912])
    .addTo(map)
    .bindPopup('<b>Mural 2</b><br>Poznań');

  L.marker([52.391, 16.953])
    .addTo(map)
    .bindPopup('<b>Mural 3</b><br>Posnania');

</script>

</body>
</html>
