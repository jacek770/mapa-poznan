<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

  const map = L.map('map').setView([52.4064, 16.9252], 13);

  L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  L.marker([52.408, 16.934])
    .addTo(map)
    .bindPopup('<b>Ratusz 1</b><br>to jeden z najcenniejszych zabytków renesansowych w Europie');

  L.marker([52.402, 16.912])
    .addTo(map)
    .bindPopup('<b>Mural 2</b><br>Poznań');

L.marker([52.408404, 16.957374], {
  icon: L.divIcon({
    className: '',
    html: `
      <svg width="30" height="38" viewBox="0 0 40 50">
        <path
          d="M20 49 C20 49 4 30 4 18 C4 8 11 2 20 2 C29 2 36 8 36 18 C36 30 20 49 20 49Z"
          fill="orange"
          stroke="white"
          stroke-width="2"/>
        <circle cx="16" cy="18" r="6" fill="white"/>
      </svg>
    `,
    iconSize: [30, 38],
    iconAnchor: [20, 50],
    popupAnchor: [0, -50]
  })
})
.addTo(map)
.bindPopup('<b>Pomnik</b><br>Pomnik lokomotywa Tx26-423');

  L.marker([52.407582, 16.955718])
    .addTo(map)
    .bindPopup('<b>Pomnik </b><br>Kotwica upamiętniająca statek SS Poznań');

  L.marker([52.407770, 16.956728])
    .addTo(map)
    .bindPopup('<b>Jaz </b><br>Jaz Cybiński mający na celu spiętrzenie wody. Powstał w drugiej połowie XIX w.');

  L.marker([52.402, 16.912])
    .addTo(map)
    .bindPopup('<b>POOUUGHHDJJHDKJ </b><br>Poznań');

  L.marker([52.398542, 16.953809])
    .addTo(map)
    .bindPopup('<b>Lucie </b><br>Rzeźba dziewczynki przed centrum handlowym Posnania w Poznaniu to monumentalna instalacja zatytułowana „Lucie”');

</script>

</body>
</html>
